[workspace]
resolver = "2"
members = [
    "crates/same-core",
    "crates/same-acp",
    "crates/same-agent",
    "crates/same-app",
]

[workspace.package]
version = "0.6.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time", "fs"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5.0"
rusqlite = { version = "0.33", features = ["bundled"] }
gpui = { package = "gpui-pre", version = "0.3.14" }
gpui-platform = { package = "gpui-pre-platform", version = "0.3.14", features = ["wayland", "x11", "font-kit"] }
gpui-component = "0.11.0"
gpui-kit-assets = "0.11.0"
notify-rust = "4.19"
same-core = { path = "crates/same-core" }
same-acp = { path = "crates/same-acp" }
same-agent = { path = "crates/same-agent" }

# Keep only line tables for our own crates: backtraces still show file:line,
# while target/ stays much smaller and linking is faster. Variables are not
# inspectable in a debugger; switch back to "full" locally if needed.
[profile.dev]
debug = "line-tables-only"

# Optimize dependencies (gpui and friends) even in dev builds: unoptimized
# gpui renders far below the display's frame rate. Our own crates stay at
# opt-level 0 so incremental builds remain fast. Dependencies carry no debug
# info since we rarely step into them.
[profile.dev.package."*"]
opt-level = 3
debug = false
